<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jungle Runner 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
canvas{display:block;width:100vw;height:100vh}

#hud{
 position:fixed;top:12px;left:12px;right:12px;
 display:none;justify-content:space-between;
 color:white;font-size:22px;font-weight:bold;
 text-shadow:2px 2px 4px #000
}

#controls{
 position:fixed;bottom:20px;left:0;right:0;
 display:none;justify-content:space-around
}

button{
 width:85px;height:60px;border:0;border-radius:18px;
 background:#ffffffaa;font-size:28px
}

#menu{
 position:fixed;inset:0;display:flex;
 flex-direction:column;align-items:center;
 justify-content:center;
 background:linear-gradient(#1976d2aa,#174d20dd);
 color:white;text-align:center
}

#menu h1{
 font-size:45px;margin:0 0 10px;
 text-shadow:3px 3px 5px #000
}

#menu p{font-size:20px}

#play{
 width:190px;height:65px;border-radius:20px;
 background:#ffca28;color:#222;font-size:25px;
 font-weight:bold;box-shadow:0 5px 0 #9b7610
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
 <div id="score">🪙 0</div>
 <div id="lives">❤️❤️❤️</div>
 <div id="best">🏆 0</div>
</div>

<div id="controls">
 <button onclick="move(-1)">⬅️</button>
 <button onclick="jump()">⬆️</button>
 <button onclick="move(1)">➡️</button>
</div>

<div id="menu">
 <h1>🏃 Jungle Runner</h1>
 <p>Run • Jump • Collect Coins</p>
 <p id="menuBest">🏆 Best: 0</p>
 <button id="play" onclick="startGame()">▶ PLAY</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const menu=document.getElementById("menu");
const hud=document.getElementById("hud");
const controls=document.getElementById("controls");

const scoreBox=document.getElementById("score");
const livesBox=document.getElementById("lives");
const bestBox=document.getElementById("best");
const menuBest=document.getElementById("menuBest");

function resize(){
 canvas.width=innerWidth;
 canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let lane=1;
let jumpY=0;
let jumpSpeed=0;
let jumping=false;

let score=0;
let lives=3;
let best=Number(localStorage.getItem("jungleBest")||0);

let speed=5;
let playing=false;
let frame=0;

let obstacles=[];
let coins=[];
let trees=[];

let spawnO,spawnC,spawnT;

menuBest.textContent="🏆 Best: "+best;

function roadX(l,y){
 let center=canvas.width/2;
 let depth=Math.max(.05,y/canvas.height);
 let width=80+depth*480;
 return center+(l-1)*width/2.5;
}

function move(d){
 if(playing){
  lane=Math.max(0,Math.min(2,lane+d));
 }
}

function jump(){
 if(playing&&!jumping){
  jumping=true;
  jumpSpeed=17;
 }
}

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-1);
 if(e.key==="ArrowRight")move(1);
 if(e.key==="ArrowUp"||e.key===" ")jump();
});

function spawnObstacle(){
 obstacles.push({
  lane:Math.floor(Math.random()*3),
  y:-60
 });
}

function spawnCoin(){
 coins.push({
  lane:Math.floor(Math.random()*3),
  y:-30,
  rot:0
 });
}

function spawnTree(){
 trees.push({
  side:Math.random()<.5?-1:1,
  y:-100,
  size:35+Math.random()*25
 });
}

function drawSky(){
 let g=ctx.createLinearGradient(0,0,0,canvas.height);

 g.addColorStop(0,"#58b9ff");
 g.addColorStop(.55,"#bdeaff");
 g.addColorStop(.56,"#65b84b");
 g.addColorStop(1,"#28752c");

 ctx.fillStyle=g;
 ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.fillStyle="#ffe082";
 ctx.beginPath();
 ctx.arc(canvas.width-70,80,38,0,Math.PI*2);
 ctx.fill();
}

function drawRoad(){
 let c=canvas.width/2;

 ctx.fillStyle="#3e3e3e";

 ctx.beginPath();
 ctx.moveTo(c-70,0);
 ctx.lineTo(c+70,0);
 ctx.lineTo(c+canvas.width*.48,canvas.height);
 ctx.lineTo(c-canvas.width*.48,canvas.height);
 ctx.closePath();
 ctx.fill();

 ctx.strokeStyle="#eee";
 ctx.lineWidth=5;
 ctx.setLineDash([25,25]);

 for(let i=0;i<2;i++){
  let x=c+(i===0?-1:1)*45;

  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(
   c+(i===0?-1:1)*230,
   canvas.height
  );
  ctx.stroke();
 }

 ctx.setLineDash([]);
}

function drawTree(t){
 let y=t.y;
 let depth=Math.max(.2,y/canvas.height+.2);
 let s=t.size*depth;

 let x=
  canvas.width/2+
  t.side*(120+depth*220);

 ctx.fillStyle="#704214";
 ctx.fillRect(
  x-s*.12,
  y-s*2,
  s*.24,
  s*2
 );

 ctx.fillStyle="#176b2c";
 ctx.beginPath();
 ctx.arc(
  x,
  y-s*2.3,
  s,
  0,
  Math.PI*2
 );
 ctx.fill();

 ctx.fillStyle="#238b35";
 ctx.beginPath();
 ctx.arc(
  x-s*.35,
  y-s*1.8,
  s*.75,
  0,
  Math.PI*2
 );
 ctx.fill();
}

function drawCoin(c){
 let x=roadX(c.lane,c.y);
 let s=8+(c.y/canvas.height)*25;

 let squash=Math.abs(Math.cos(c.rot));

 ctx.save();
 ctx.translate(x,c.y);
 ctx.scale(Math.max(.12,squash),1);

 ctx.fillStyle="#ffd21f";

 ctx.beginPath();
 ctx.arc(0,0,s,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#fff3a0";
 ctx.lineWidth=3;
 ctx.stroke();

 ctx.restore();
}

function drawObstacle(o){
 let x=roadX(o.lane,o.y);
 let s=18+(o.y/canvas.height)*55;

 ctx.fillStyle="#111";
 ctx.globalAlpha=.3;

 ctx.beginPath();
 ctx.ellipse(
  x,o.y+8,
  s,s*.35,
  0,0,Math.PI*2
 );
 ctx.fill();

 ctx.globalAlpha=1;

 ctx.fillStyle="#b63b25";

 ctx.beginPath();
 ctx.moveTo(x-s,o.y);
 ctx.lineTo(x+s,o.y);
 ctx.lineTo(x+s*.75,o.y-s);
 ctx.lineTo(x-s*.75,o.y-s);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#e65a35";

 ctx.fillRect(
  x-s*.65,
  o.y-s*.8,
  s*1.3,
  s*.18
 );
}

function drawPlayer(){
 let x=roadX(lane,canvas.height-120);
 let base=canvas.height-120-jumpY;

 let run=Math.sin(frame*.35)*8;

 ctx.fillStyle="#111";
 ctx.globalAlpha=.3;

 ctx.beginPath();
 ctx.ellipse(
  x,
  canvas.height-105,
  30,10,
  0,0,Math.PI*2
 );
 ctx.fill();

 ctx.globalAlpha=1;

 ctx.fillStyle="#1565c0";
 ctx.fillRect(
  x-18,base-55,
  36,55
 );

 ctx.fillStyle="#ffd19a";

 ctx.beginPath();
 ctx.arc(
  x,base-75,
  17,0,Math.PI*2
 );
 ctx.fill();

 ctx.fillStyle="#542d16";

 ctx.beginPath();
 ctx.arc(
  x,base-84,
  18,Math.PI,Math.PI*2
 );
 ctx.fill();

 ctx.fillStyle="#222";

 ctx.save();
 ctx.translate(x-10,base);
 ctx.rotate(run*.03);
 ctx.fillRect(-5,0,12,28);
 ctx.restore();

 ctx.save();
 ctx.translate(x+10,base);
 ctx.rotate(-run*.03);
 ctx.fillRect(-5,0,12,28);
 ctx.restore();
}

function loseLife(){
 lives--;

 livesBox.textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);

 obstacles=[];

 if(lives<=0){
  endGame();
 }
}

function update(){
 if(!playing)return;

 frame++;

 if(jumping){
  jumpY+=jumpSpeed;
  jumpSpeed-=1;

  if(jumpY<=0){
   jumpY=0;
   jumping=false;
  }
 }

 obstacles.forEach(o=>o.y+=speed);

 coins.forEach(c=>{
  c.y+=speed;
  c.rot+=.12;
 });

 trees.forEach(t=>t.y+=speed*.8);

 let px=roadX(
  lane,
  canvas.height-120
 );

 let py=canvas.height-120-jumpY;

 for(let i=obstacles.length-1;i>=0;i--){

  let o=obstacles[i];
  let ox=roadX(o.lane,o.y);

  if(
   Math.abs(px-ox)<45 &&
   Math.abs(py-o.y)<55 &&
   jumpY<45
  ){
   obstacles.splice(i,1);
   loseLife();
   break;
  }
 }

 coins=coins.filter(c=>{
  let cx=roadX(c.lane,c.y);

  if(
   Math.abs(px-cx)<40 &&
   Math.abs(py-c.y)<60
  ){
   score+=10;
   return false;
  }

  return c.y<canvas.height+50;
 });

 obstacles=obstacles.filter(
  o=>o.y<canvas.height+100
 );

 trees=trees.filter(
  t=>t.y<canvas.height+150
 );

 score++;

 speed=5+Math.min(5,score/500);

 scoreBox.textContent="🪙 "+score;

 if(score>best){
  best=score;
  bestBox.textContent="🏆 "+best;
 }
}

function endGame(){

 playing=false;

 clearInterval(spawnO);
 clearInterval(spawnC);
 clearInterval(spawnT);

 if(score>best){
  best=score;
  localStorage.setItem(
   "jungleBest",
   best
  );
 }

 setTimeout(()=>{

  menu.innerHTML=
   "<h1>💥 Game Over</h1>"+
   "<p>Score: "+score+"</p>"+
   "<p>🏆 Best: "+best+"</p>"+
   '<button id="play" onclick="startGame()">🔄 PLAY AGAIN</button>';

  menu.style.display="flex";
  hud.style.display="none";
  controls.style.display="none";

 },200);
}

function startGame(){

 lane=1;
 jumpY=0;
 jumping=false;

 score=0;
 lives=3;
 speed=5;
 frame=0;

 obstacles=[];
 coins=[];
 trees=[];

 playing=true;

 menu.style.display="none";
 hud.style.display="flex";
 controls.style.display="flex";

 scoreBox.textContent="🪙 0";
 livesBox.textContent="❤️❤️❤️";
 bestBox.textContent="🏆 "+best;

 spawnO=setInterval(
  spawnObstacle,
  1100
 );

 spawnC=setInterval(
  spawnCoin,
  600
 );

 spawnT=setInterval(
  spawnTree,
  450
 );
}

function draw(){

 drawSky();
 drawRoad();

 trees.forEach(drawTree);
 coins.forEach(drawCoin);
 obstacles.forEach(drawObstacle);

 drawPlayer();
}

function loop(){

 update();
 draw();

 requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
