<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeHub Demo</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1220;
  color:white;
}
header{
  background:#111b2e;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}
.card{
  background:#162238;
  padding:18px;
  border-radius:15px;
  margin-bottom:15px;
}
.price{
  font-size:30px;
  font-weight:bold;
  margin:10px 0;
}
.small{
  color:#9ca3af;
  font-size:14px;
}
.coin{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#1d2b43;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
}
.coin button{
  background:#2563eb;
  color:white;
  border:0;
  padding:9px 14px;
  border-radius:8px;
}
.chart{
  height:180px;
  background:#0d1728;
  border-radius:12px;
}
canvas{
  width:100%;
  height:100%;
}
.buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}
.buttons button{
  flex:1;
  padding:14px;
  border:0;
  border-radius:10px;
  color:white;
  font-size:17px;
  font-weight:bold;
}
.buy{background:#16a34a;}
.sell{background:#dc2626;}
.info{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
}
.history{
  max-height:300px;
  overflow:auto;
}
.history-item{
  background:#1d2b43;
  padding:12px;
  border-radius:10px;
  margin:8px 0;
}
.buyText{color:#4ade80;}
.sellText{color:#f87171;}
</style>
</head>

<body>

<header>📈 TradeHub Demo</header>

<div class="container">

<div class="card">
  <div class="small">Virtual Balance</div>
  <div class="price" id="balance">$10,000</div>
  <div class="small">Demo money only</div>
</div>

<div class="card">
  <h2>🪙 Demo Coins</h2>
  <div id="coinList"></div>
</div>

<div class="card">
  <h2 id="coinTitle">₿ Bitcoin</h2>
  <div class="small">Demo Price</div>
  <div class="price" id="price">$65,000</div>

  <div class="chart">
    <canvas id="chart"></canvas>
  </div>

  <div class="buttons">
    <button class="buy" onclick="buy()">BUY</button>
    <button class="sell" onclick="sell()">SELL</button>
  </div>
</div>

<div class="card">
  <h2>📊 Portfolio</h2>
  <div id="portfolio"></div>
</div>

<div class="card">
  <h2>🕒 Transaction History</h2>
  <div id="history" class="history">
    <div class="small">No transactions yet.</div>
  </div>
</div>

</div>

<script>

let balance = 10000;
let selected = "BTC";
let transactions = [];

let coins = {
  BTC:{name:"Bitcoin",symbol:"₿",price:65000,amount:0},
  ETH:{name:"Ethereum",symbol:"Ξ",price:3500,amount:0},
  SOL:{name:"Solana",symbol:"◎",price:150,amount:0},
  DOGE:{name:"Dogecoin",symbol:"Ð",price:0.18,amount:0}
};

const canvas=document.getElementById("chart");
const ctx=canvas.getContext("2d");

function money(value){
  return "$"+Number(value).toLocaleString(undefined,{
    maximumFractionDigits:2
  });
}

function renderCoins(){

  let html="";

  for(let key in coins){

    let c=coins[key];

    html+=`
      <div class="coin">
        <div>
          <b>${c.symbol} ${c.name}</b><br>
          <span class="small">${key} • ${money(c.price)}</span>
        </div>

        <button onclick="selectCoin('${key}')">
          Trade
        </button>
      </div>
    `;
  }

  document.getElementById("coinList").innerHTML=html;
}

function selectCoin(key){

  selected=key;

  let c=coins[key];

  document.getElementById("coinTitle").innerText=
    c.symbol+" "+c.name;

  document.getElementById("price").innerText=
    money(c.price);

  drawChart();
}

function buy(){

  let c=coins[selected];

  if(balance < c.price){
    alert("Not enough demo balance.");
    return;
  }

  balance-=c.price;
  c.amount+=1;

  addTransaction("BUY",selected,c.price);
  update();
}

function sell(){

  let c=coins[selected];

  if(c.amount<1){
    alert("You don't own this demo coin.");
    return;
  }

  c.amount-=1;
  balance+=c.price;

  addTransaction("SELL",selected,c.price);
  update();
}

function addTransaction(type,symbol,price){

  let now=new Date();

  let time=now.toLocaleTimeString();

  transactions.unshift({
    type:type,
    symbol:symbol,
    price:price,
    time:time
  });

  renderHistory();
}

function renderHistory(){

  let box=document.getElementById("history");

  if(transactions.length===0){
    box.innerHTML=
      "<div class='small'>No transactions yet.</div>";
    return;
  }

  let html="";

  transactions.forEach(t=>{

    let c=coins[t.symbol];

    html+=`
      <div class="history-item">
        <b class="${t.type==="BUY"?"buyText":"sellText"}">
          ${t.type}
        </b>
        — ${c.symbol} ${t.symbol}
        <br>
        <span class="small">
          Price: ${money(t.price)} • ${t.time}
        </span>
      </div>
    `;
  });

  box.innerHTML=html;
}

function renderPortfolio(){

  let html="";
  let total=0;

  for(let key in coins){

    let c=coins[key];

    if(c.amount>0){

      let value=c.amount*c.price;
      total+=value;

      html+=`
        <div class="info">
          <span>${c.symbol} ${key}</span>
          <span>${c.amount.toFixed(4)} — ${money(value)}</span>
        </div>
      `;
    }
  }

  html+=`
    <hr>
    <div class="info">
      <b>Portfolio Value</b>
      <b>${money(total)}</b>
    </div>
  `;

  document.getElementById("portfolio").innerHTML=html;
}

function update(){

  for(let key in coins){

    let c=coins[key];

    c.price+=(Math.random()-0.48)*c.price*0.01;

    if(c.price<0.0001)
      c.price=0.0001;
  }

  document.getElementById("balance").innerText=
    money(balance);

  document.getElementById("price").innerText=
    money(coins[selected].price);

  renderCoins();
  renderPortfolio();
  renderHistory();
  drawChart();
}

function drawChart(){

  let w=canvas.clientWidth;
  let h=canvas.clientHeight;

  canvas.width=w*2;
  canvas.height=h*2;

  ctx.setTransform(2,0,0,2,0,0);
  ctx.clearRect(0,0,w,h);

  ctx.beginPath();

  for(let x=0;x<w;x+=10){

    let y=
      h*0.55+
      Math.sin(x/22)*25+
      Math.sin(x/8)*7;

    if(x===0)
      ctx.moveTo(x,y);
    else
      ctx.lineTo(x,y);
  }

  ctx.strokeStyle="#22c55e";
  ctx.lineWidth=3;
  ctx.stroke();
}

renderCoins();
renderPortfolio();
renderHistory();
selectCoin("BTC");

setInterval(update,2000);

</script>

</body>
</html>
