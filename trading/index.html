<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeHub Demo</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1220;
  color:white;
}
header{
  background:#111b2e;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
.container{
  padding:20px;
  max-width:700px;
  margin:auto;
}
.card{
  background:#162238;
  padding:18px;
  border-radius:15px;
  margin-bottom:15px;
}
.price{
  font-size:32px;
  font-weight:bold;
  margin:10px 0;
}
.chart{
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:linear-gradient(135deg,#14233a,#0d1728);
  overflow:hidden;
}
canvas{
  width:100%;
  height:100%;
}
.buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}
button{
  flex:1;
  padding:14px;
  border:0;
  border-radius:10px;
  color:white;
  font-size:17px;
  font-weight:bold;
}
.buy{background:#16a34a;}
.sell{background:#dc2626;}
.info{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
}
.small{
  color:#9ca3af;
  font-size:14px;
}
</style>
</head>

<body>

<header>📈 TradeHub Demo</header>

<div class="container">

<div class="card">
  <div class="small">Virtual Balance</div>
  <div class="price">$10,000</div>
  <div class="small">Demo money only</div>
</div>

<div class="card">
  <h2>BTC / USD</h2>

  <div class="info">
    <span>Bitcoin</span>
    <span id="change">+2.35%</span>
  </div>

  <div class="price" id="price">$65,000</div>

  <div class="chart">
    <canvas id="chart"></canvas>
  </div>

  <div class="buttons">
    <button class="buy" onclick="buy()">BUY</button>
    <button class="sell" onclick="sell()">SELL</button>
  </div>
</div>

<div class="card">
  <h2>📊 Portfolio</h2>
  <div class="info">
    <span>BTC</span>
    <span id="coins">0 BTC</span>
  </div>
  <div class="info">
    <span>Demo P/L</span>
    <span id="profit">$0</span>
  </div>
</div>

</div>

<script>
let price = 65000;
let coins = 0;
let balance = 10000;

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

function drawChart(){
  canvas.width = canvas.clientWidth * 2;
  canvas.height = canvas.clientHeight * 2;

  ctx.scale(2,2);

  let w = canvas.clientWidth;
  let h = canvas.clientHeight;

  ctx.beginPath();
  ctx.moveTo(0,h*0.7);

  for(let x=0;x<w;x+=10){
    let y = h*0.55 + Math.sin(x/25)*25 - x*0.001;
    ctx.lineTo(x,y);
  }

  ctx.strokeStyle = "#22c55e";
  ctx.lineWidth = 3;
  ctx.stroke();
}

function update(){
  price += (Math.random()-0.48)*300;

  document.getElementById("price").innerText =
    "$"+Math.round(price).toLocaleString();

  document.getElementById("coins").innerText =
    coins.toFixed(5)+" BTC";

  document.getElementById("profit").innerText =
    "$"+Math.round(coins*price).toLocaleString();

  drawChart();
}

function buy(){
  if(balance >= price){
    balance -= price;
    coins += 1;
    alert("Demo BUY successful!");
  }else{
    alert("Not enough demo balance.");
  }
  update();
}

function sell(){
  if(coins >= 1){
    coins -= 1;
    balance += price;
    alert("Demo SELL successful!");
  }else{
    alert("You don't have BTC.");
  }
  update();
}

setInterval(update,2000);
update();
</script>

</body>
</html>
