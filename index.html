<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Maps</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{
    height:100%;
    margin:0;
}

#map{
    width:100%;
}

.search{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    width:85%;
    max-width:500px;
}

.search input{
    width:100%;
    box-sizing:border-box;
    padding:15px 20px;
    border:0;
    border-radius:30px;
    font-size:16px;
    box-shadow:0 3px 12px #777;
    outline:none;
}

.title{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    background:white;
    padding:10px 18px;
    border-radius:20px;
    box-shadow:0 2px 8px #777;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="search">
    <input id="search" type="text"
    placeholder="🔍 Search Google Maps style...">
</div>

<div id="map"></div>

<div class="title">🌍 My Maps</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([27.7172,85.3240], 7);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19,
    attribution:'© OpenStreetMap'
}).addTo(map);

const marker = L.marker([27.7172,85.3240]).addTo(map);

marker.bindPopup(
'<b>📍 Nepal</b><br>My Maps'
);

document.getElementById('search').addEventListener('keypress',
function(e){

    if(e.key === 'Enter'){
        const place = this.value.trim();

        if(place){
            alert('Searching for: ' + place);
        }
    }

});
</script>

</body>
</html>
